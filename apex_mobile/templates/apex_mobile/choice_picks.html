{% extends 'apex_mobile/base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8">
    <h2 class="text-3xl font-bold text-white mb-6">Apex Choice Picks</h2>
    
    <!-- This loop goes through every product in your database -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
        {% for product in products %}
        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
            {% if product.image %}
                <img src="{{ product.image.url }}" class="w-full h-40 object-cover rounded mb-4">
            {% endif %}
            <h3 class="text-white font-bold">{{ product.name }}</h3>
            <p class="text-blue-500 font-bold mt-2">KES {{ product.price }}</p>
            <a href="{% url 'product_detail' product.slug %}" class="block text-center mt-4 bg-blue-600 text-white py-2 rounded hover:bg-blue-700">View Details</a>
        </div>
        {% empty %}
            <p class="text-slate-400">No products available in choice picks yet.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
