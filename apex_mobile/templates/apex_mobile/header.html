<!-- templates/apex_mobile/header.html -->
<header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-50">
    <!-- Top Bar -->
    <div class="text-xs text-slate-400 px-6 py-1 flex justify-end gap-4 border-b border-slate-900">
        <a href="#" class="hover:text-white">Help Center</a>
        <a href="#" class="hover:text-white">Account</a>
    </div>
    
    <nav class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between p-4 gap-4">
    <!-- Logo -->
    <a href="{% url 'home' %}" class="text-2xl font-bold text-white">APEX<span class="text-blue-500">MOBILE</span></a>
    
    <!-- Search -->
    <div class="w-full md:flex-1 md:mx-8">
        <form action="{% url 'home' %}" method="GET" class="flex">
            <input type="text" name="search" placeholder="Search premium smartphones..." class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-l-md text-white focus:outline-none focus:border-blue-500">
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white font-bold rounded-r-md">Search</button>
        </form>
    </div>

    <!-- Navigation Links -->
    <div class="flex flex-wrap items-center justify-center gap-6 text-white font-medium">
        <a href="{% url 'home' %}" class="hover:text-blue-400">Shop</a>
        <a href="{% url 'choice_picks' %}" class="hover:text-blue-400">Choice Picks</a>
        <a href="{% url 'login' %}" class="hover:text-blue-400">Login</a>
    </div>
</nav>
</header>
